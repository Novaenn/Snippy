[workspace]
members = ["crates/snippy-core", "crates/snippy", "crates/snippy-gui"]
default-members = ["crates/snippy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
snippy-core = { path = "crates/snippy-core" }
clap = { version = "=4.6.7", features = ["derive"] }
gtk = { package = "gtk4", version = "=0.10.1", features = ["v4_8"] }
x11rb = { version = "=0.13.2", features = ["xfixes", "res", "randr"] }
futures-channel = "=0.3.34"
futures-util = "=0.3.34"
rusqlite = { version = "=0.42.0", default-features = false, features = ["limits"] }
blake3 = "=1.8.2"
png = "=0.18.1"
zeroize = "=1.9.1"
tempfile = "=3.27.0"
rpassword = "=7.4.0"
rustix = { version = "=1.1.6", features = ["process", "fs", "net", "event"] }
signal-hook = { version = "=0.3.18", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

